<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世新同路互動地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a 2.5D island map on the left, a panel with views (home, building, route) on the right; stacks on phones. QR sheet below. */
  --sea:#D7E9EC;
  --ink:#17211F;
  --muted:#4C5856;
  --card:#FFFFFF;
  --line:#CBD8D6;
  --soft:#F1F5F4;
  --gate:#2E7D32;
  --here:#D7263D;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E9F1F0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px}
.stripe{display:flex;height:6px}.stripe i{flex:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--display);font-weight:900;font-size:20px}
.brand span{color:var(--muted);font-size:14px}
.pill-btn{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:700;font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px 20px;align-items:start}
.mapwrap{position:relative;border-radius:18px;overflow:hidden;height:760px;border:1px solid var(--line);background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;cursor:pointer}
.maphint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--line)}
.card h2{margin:0 0 8px;font-size:15px;font-weight:900;font-family:var(--display);text-wrap:balance}
.card p{margin:0 0 8px}
.note{font-size:13px;color:var(--muted)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;cursor:pointer}
.res small{display:block;color:var(--muted);font-size:12px}
.here-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--here)}
.here-dot{width:10px;height:10px;border-radius:50%;background:var(--here)}
.here-place{font-size:21px;font-weight:900;line-height:1.3;margin:2px 0 10px;font-family:var(--display)}
.near{display:flex;flex-direction:column;gap:8px}
.near-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft)}
.near-row small{display:block;color:var(--muted);font-size:12px}
.near-row strong{font-size:14px}
.btn{border:none;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.wide{width:100%;padding:10px 14px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.demo{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
select{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.matches{margin-top:10px;display:flex;flex-direction:column}
.match{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border:none;border-bottom:1px solid #E8EEED;cursor:pointer;background:none;text-align:left;width:100%}
.match span:last-child{font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;font-weight:900;font-size:15px;cursor:pointer;padding:4px 0;margin:-4px 0 8px}
.d-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.code{min-width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;padding:0 8px}
.d-name{font-size:20px;font-weight:900;line-height:1.25;font-family:var(--display)}
.zone-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ink);color:#fff}
.tag.light{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.floors{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.floors details{border:1px solid var(--line);border-radius:10px;background:#fff}
.floors details[open]{background:var(--soft)}
.floors summary{cursor:pointer;padding:8px 10px;display:flex;align-items:center;gap:8px;list-style:none}
.floors summary::-webkit-details-marker{display:none}
.floors summary b{min-width:52px;font-variant-numeric:tabular-nums}
.floors summary .mini{display:flex;gap:4px;flex-wrap:wrap}
.floors summary .mini i{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--ink);color:#fff}
.floors ul{margin:0;padding:0 12px 10px 30px;font-size:13px}
.floors li.hit{font-weight:900;background:#FFF1B8;border-radius:4px}
.construction{padding:12px;border-radius:12px;background:#FFF6D6;border:1.5px dashed #B38A00;font-weight:700}
.qrmini{display:flex;gap:12px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.qrmini .qr{width:84px;height:84px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.plan label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.swap{grid-row:1/3;grid-column:2;align-self:center;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.steps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;position:relative}
.steps li .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff}
.steps li:not(:last-child)::after{content:"";position:absolute;left:11px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.follow{margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:900;color:#fff}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zones .chip{justify-content:flex-start;border-radius:10px}
.sheet{padding:0 20px 24px}
.sheet .card{padding:18px 20px}
.qrhead{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:14px}
.qrhead label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);flex:1;min-width:260px}
.qrhead input{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qrcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:#fff}
.qrcard .qr{width:132px;height:132px}
.qrcard b{font-size:14px;line-height:1.3}
.qrcard code{font-size:11px;color:var(--muted);word-break:break-all}
.qrfail{font-size:12px;color:var(--muted);padding:20px 8px}
footer{padding:0 20px 28px;font-size:12px;color:var(--muted)}
svg text{font-family:var(--body)}
.bld{cursor:pointer;transition:opacity .25s}
.bld.dim{opacity:.25}
.bld.sel .roof{stroke:#17211F;stroke-width:3}
.bld:focus{outline:none}
.bld:focus-visible .roof{stroke:#1F5FBF;stroke-width:4}
.lbl{pointer-events:none;transition:opacity .25s}
.lbl.dim{opacity:.15}
.name{opacity:0;transition:opacity .25s}
svg.zoomed .name,.lbl.show .name{opacity:1}
svg.zoomed .closed-name{opacity:0}
.lbl.show .closed-name{opacity:1}
.pulse{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 1.6s ease-out infinite}
  .march{animation:march 1s linear infinite}
}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes march{to{stroke-dashoffset:-28}}
/* route type, recommendation */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:8px -2px 4px;scroll-snap-type:x mandatory}
.days button{flex:0 0 auto;scroll-snap-align:start;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;position:relative}
.days button small{font-size:11px;color:var(--muted)}
.days button b{font-size:15px}
.days button i{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#E11D74;color:#fff;font-style:normal;font-size:11px;font-weight:800;text-align:center;padding:0 4px}
.days button[aria-pressed="true"]{background:#17211F;border-color:#17211F;color:#fff}
.days button[aria-pressed="true"] small{color:#D8DEDC}
.pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:2px 0 6px}
.pick input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.ev-day{margin:12px 0 4px;font-size:15px}
.ev-date{display:block;font-size:11px;font-weight:800;color:#E11D74;white-space:nowrap}
.ev-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;margin:6px 0;border-radius:12px;background:var(--soft)}
.ev-time b{display:block;font-size:15px;font-weight:900}
.ev-time small{color:var(--muted);font-size:12px}
.ev-body{all:unset;cursor:pointer;display:block;min-width:0}
.ev-body:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px;border-radius:6px}
.ev-body strong{display:block;line-height:1.35}
.ev-body small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.ev-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.ev-meta i{font-style:normal;font-size:11px;font-weight:800;color:#fff;padding:1px 7px;border-radius:999px}
.ev-meta em{font-style:normal;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:#fff;color:var(--muted);border:1px solid var(--line)}
.ev-meta em.st-now{background:#E11D74;color:#fff;border-color:#E11D74}
.ev-now{background:#FDE7F1;box-shadow:inset 3px 0 0 #E11D74}
.ev-done{opacity:.55}
.ev .btn{padding:8px 12px}
.places{margin:4px 0 6px;padding-left:18px}
.places li{margin:3px 0}
.lm .pz-hit{transition:fill .2s}
.lm:hover .pz-hit,.lm:focus-visible .pz-hit{fill:rgba(184,138,46,.18)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:10px 0 8px;border-radius:12px;background:var(--soft)}
.seg button{border:0;border-radius:9px;padding:9px 6px;font:inherit;font-weight:800;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#0E5A70;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reco{margin:0 0 10px;padding:12px 14px;border-radius:12px;background:#E6F4F7;border:1.5px solid #0E7490}
.reco-h{font-weight:900;color:#0E5A70;margin-bottom:4px}
.reco p{margin:0}
.reco-tips{margin:8px 0 0;padding-left:18px}
.reco-tips li{margin:2px 0}
.hint-stairs{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:#FFF1E6;border:1px solid #E36C0A;color:#7A3A0A}
.access{margin:8px 0;padding:10px 12px;border-radius:10px;background:#E6F4F7;border:1px solid #0E7490;color:#0E4A5C}
/* wishing fountain — magic edition */
.wish{position:relative;overflow:hidden;isolation:isolate;margin:12px 0 4px;padding:16px;border-radius:16px;color:#F3EEFF;background:radial-gradient(120% 90% at 50% 0%,#3D2C80 0%,#1C1945 55%,#0D0F26 100%);border:1px solid #3A3470;box-shadow:0 8px 30px rgba(40,20,110,.25)}
.wish h3{margin:0 0 4px;font-size:17px;font-weight:900;letter-spacing:.06em;background:linear-gradient(90deg,#FFE7A3,#FFFFFF,#B9E8FF,#FFE7A3);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.wish .note{color:#CFC8F0}
.wish .sky{position:absolute;inset:0;z-index:-1;pointer-events:none}
.wish .sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.6);opacity:.25}
.pool{position:relative;height:100px;margin:10px 0 12px;border-radius:50%/42%;background:radial-gradient(ellipse at 50% 55%,#B8F3FF 0%,#5FC9DD 38%,#2A7FA8 75%,#18456E 100%);overflow:hidden;box-shadow:0 0 26px rgba(120,220,255,.45),inset 0 -8px 0 rgba(0,0,0,.18)}
.pool::before{content:"";position:absolute;inset:-40%;background:repeating-radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.18) 0 6px,transparent 6px 22px);mix-blend-mode:screen;opacity:.55}
.pool .globe{position:absolute;left:50%;top:28px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#D7E4EA 50%,#8FA3AA);box-shadow:0 0 14px 3px rgba(200,240,255,.7)}
.pool .globe::after{content:"";position:absolute;left:-10px;top:11px;width:46px;height:9px;border:2px solid #E9F6FF;border-radius:50%;transform:rotate(-14deg);box-shadow:0 0 8px rgba(255,255,255,.8)}
.wish input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid rgba(255,255,255,.22);border-radius:10px;font:inherit;margin-bottom:10px;background:rgba(255,255,255,.08);color:#fff}
.wish input::placeholder{color:#B9B2DD}
.wish .btn{position:relative;border:0;color:#2A1E00;font-weight:900;background:linear-gradient(100deg,#E9AE3C,#FFE7A3 45%,#FFF6D8 50%,#FFE7A3 55%,#E9AE3C);background-size:220% 100%;box-shadow:0 0 18px rgba(245,196,81,.5)}
.wish-msg{min-height:1.6em;margin:12px 0 4px;font-weight:900;font-size:16px;color:#FFF3C4;text-shadow:0 0 10px rgba(255,214,120,.9),0 0 22px rgba(255,170,240,.5)}
.wish-msg:empty{margin:0}
.wish-msg .ch{display:inline-block;white-space:pre}
.wish #wish-count{color:#CFC8F0}
.wish canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
@media (prefers-reduced-motion:no-preference){
  .wish h3{animation:shine 4s linear infinite}
  .wish .btn{animation:shine 3s linear infinite}
  .wish .sky i{animation:twinkle 2.6s ease-in-out infinite}
  .pool::before{animation:caustic 9s linear infinite}
  .wish.cast .pool{animation:poolflash 1.2s ease-out}
  .wish.cast .globe{animation:globeglow 1.4s ease-out}
  .wish.cast.big{animation:aurora 2s ease-out}
  .wish-msg .ch{opacity:0;animation:letter .55s cubic-bezier(.2,.8,.2,1) forwards}
}
@keyframes shine{to{background-position:-220% 0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
@keyframes caustic{to{transform:translate(18%,10%) rotate(20deg)}}
@keyframes poolflash{0%{filter:brightness(1)}20%{filter:brightness(1.9) saturate(1.4)}100%{filter:brightness(1)}}
@keyframes globeglow{0%{box-shadow:0 0 14px 3px rgba(200,240,255,.7)}25%{box-shadow:0 0 40px 18px rgba(255,230,150,.95)}100%{box-shadow:0 0 14px 3px rgba(200,240,255,.7)}}
@keyframes aurora{0%{box-shadow:0 8px 30px rgba(40,20,110,.25)}30%{box-shadow:0 0 60px 10px rgba(255,150,240,.55),0 0 90px 20px rgba(120,220,255,.4)}100%{box-shadow:0 8px 30px rgba(40,20,110,.25)}}
@keyframes letter{from{opacity:0;transform:translateY(8px) scale(.5);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:920px){
  main{grid-template-columns:1fr;padding:12px}
  .mapwrap{height:540px}
  .sheet{padding:0 12px 18px}
  header{padding:10px 12px}
}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i style="background:#1F5FBF"></i><i style="background:#6E45B8"></i><i style="background:#E2A800"></i><i style="background:#E36C0A"></i><i style="background:#0E8C8C"></i><i style="background:#C2185B"></i></div>
<header>
  <div class="brand"><b>同路 Way for All</b><span id="t-sub">世新大學互動地圖</span></div>
  <button class="pill-btn" id="lang" type="button">EN</button>
</header>
<main>
  <div class="mapwrap">
    <svg id="map" role="img" aria-labelledby="map-title"><title id="map-title">世新大學 2.5D 校園地圖</title></svg>
    <div class="zoom">
      <button type="button" id="zin" aria-label="放大">+</button>
      <button type="button" id="zout" aria-label="縮小">−</button>
      <button type="button" id="zfit" aria-label="顯示全校" style="font-size:14px">全</button>
    </div>
    <div class="maphint" id="t-hint">拖曳移動・點建築看樓層</div>
  </div>
  <aside id="panel"></aside>
</main>
<section class="sheet" aria-labelledby="qr-title">
  <div class="card">
    <div class="qrhead">
      <div>
        <h2 id="qr-title" style="margin:0 0 4px;font-size:17px;font-weight:900">各棟大樓與入口的 QR code</h2>
        <p class="note" id="t-qrnote" style="margin:0">每個 QR code 打開時，會以那個位置當作「你在這裡」。</p>
      </div>
      <label for="baseurl"><span id="t-base">公開網址（按「分享」後取得）</span><input id="baseurl" type="url" inputmode="url" autocomplete="off"></label>
    </div>
    <div class="qrgrid" id="qrgrid"></div>
  </div>
</section>
<footer id="t-foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>

"use strict";
var NS = "http://www.w3.org/2000/svg";
var DEFAULT_BASE = "https://claude.ai/artifact/57vYjHHUX4YEkKSDFRws54";
var lang = "zh", baseUrl = DEFAULT_BASE;
try {
  var sl = localStorage.getItem("shu-map-lang"); if (sl === "en" || sl === "zh") lang = sl;
} catch (e) {}

/* ===================== DATA ===================== */

  z3:{zh:"生活・廣電區", en:"Living & Broadcasting", color:"#E2A800", shape:"■", dark:true},
  z4:{zh:"舍我・廣場區", en:"She-Wo & Plaza", color:"#E36C0A", shape:"▲"},
  z5:{zh:"傳播・運動區", en:"Communication & Sports", color:"#0E8C8C", shape:"⬢"},
  z6:{zh:"管理・媒體區", en:"Management & Media", color:"#C2185B", shape:"★"}
